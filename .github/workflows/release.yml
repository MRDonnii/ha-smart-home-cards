name: Release bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare HACS asset
        run: cp dist/ha-smart-home-cards.js ha-smart-home-cards.js
      - uses: softprops/action-gh-release@v2
        with:
          files: ha-smart-home-cards.js
          generate_release_notes: true
